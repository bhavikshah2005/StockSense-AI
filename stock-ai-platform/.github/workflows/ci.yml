name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test -- --pool=threads
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense
          POSTGRES_DB: stocksense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://stocksense:stocksense@localhost:5432/stocksense
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.db.seed
      - run: pytest -q
